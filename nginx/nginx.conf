upstream flask_backend {
    server flask:5000;
    keepalive 32;
}

upstream nextjs_frontend {
    server nextjs:3000;
    keepalive 16;
}

resolver 127.0.0.11 valid=30s ipv6=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=webhook:10m rate=200r/m;

map $host $school_slug {
    ~^(?<slug>[^.]+)\.aschool\.com\.np$ $slug;
    default "";
}

proxy_cache_path /var/cache/nginx/school_pages levels=1:2 keys_zone=school_pages_cache:10m
                 max_size=1g inactive=30m use_temp_path=off;

# Main app/dashboard
server {
    listen 80;
    server_name brighternepal.com www.brighternepal.com;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/v1/auth/ {
        if ($request_method = 'OPTIONS') {
            proxy_pass http://flask_backend;
            break;
        }
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /api/ {
        if ($request_method = 'OPTIONS') {
            proxy_pass http://flask_backend;
            break;
        }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /webhooks/ {
        limit_req zone=webhook burst=200;
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /health {
        proxy_pass http://flask_backend;
    }

    location /socket.io/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /_next/static/ {
        proxy_pass http://nextjs_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}

    # APK downloads + static assets from the app-web dir
    location /downloads/ {
        alias /var/www/app.brighternepal.com/downloads/;
        add_header Cache-Control "public, max-age=3600";
    }

# Flutter web app
server {
    listen 80;
    server_name app.brighternepal.com;

    root /var/www/app.brighternepal.com;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /flutter_service_worker.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

# API Subdomain
server {
    listen 80;
    server_name api.brighternepal.com;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        if ($request_method = 'OPTIONS') {
            proxy_pass http://flask_backend;
            break;
        }
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }

    location /socket.io/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}

# School subdomains (tenant portals)
server {
    listen 80;
    server_name ~^(?<slug>[^.]+)\.brighternepal\.com$ *.brighternepal.com;

    client_max_body_size 50M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://flask_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-School-Slug $slug;
    }

    location /socket.io/ {
        proxy_pass http://flask_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-School-Slug $slug;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://nextjs_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-School-Slug $slug;

        proxy_cache school_pages_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout http_500 http_502 http_503;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /_next/static/ {
        proxy_pass http://nextjs_frontend;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
