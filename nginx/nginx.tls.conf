# =============================================================================
# S-10: TLS termination for the ASchool stack.
#
# Deployment: certificates land in ./nginx/ssl (fullchain.pem + privkey.pem)
# via EITHER certbot on the host (recommended) or a Cloudflare Origin CA cert:
#
#   certbot certonly --standalone -d aschool.com.np -d '*.aschool.com.np' \
#     --deploy-hook 'cp -r /etc/letsencrypt/live/aschool.com.np/* /opt/aschool/nginx/ssl/'
#
# Cloudflare SSL mode MUST be "Full (strict)". The default catch-all server
# block 421s unknown hosts so a school's domain can never serve another
# school's content off the wrong vhost.
# =============================================================================

# ── Cloudflare real-IP restore (S-08 companion) ────────────────────────────
# Rate-limit buckets must key on the REAL client IP, not Cloudflare's edge.
# The CF ranges below are published at https://www.cloudflare.com/ips/ —
# refresh on deploy (they change rarely, but they change).
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Shared TLS settings
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;

# HSTS — 2 years, preload-ready (only safe once ALL vhosts serve HTTPS)
map $host $hsts_header {
    default "max-age=63072000; includeSubDomains; preload";
}

# HTTP → HTTPS for every known host; unknown hosts get 421 at TLS too.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME challenge must stay on HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Catch-all HTTPS: any host we don't recognize gets 421 Misdirected Request
# (prevents a school's subdomain from being served by the wrong vhost).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;

    return 421;
}

# ── Main app/dashboard (aschool.com.np) ─────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aschool.com.np www.aschool.com.np;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 100M;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTE: route locations mirror nginx.conf's port-80 servers 1:1 — this
    # file is include()d alongside it; the port-80 server redirects here.
    include /etc/nginx/conf.d/app_locations.conf*;
}

# ── Wildcard school sites (*.aschool.com.np) ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name *.aschool.com.np;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;   # wildcard cert
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    client_max_body_size 50M;

    add_header Strict-Transport-Security $hsts_header always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include /etc/nginx/conf.d/school_locations.conf*;
}
