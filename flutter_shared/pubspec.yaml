name: aschool_shared
description: Shared core package for all ASchool Flutter apps
version: 1.0.0

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Local Database (Offline-first)

  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^2.31.1
  firebase_messaging: ^14.9.4

  # Real-time
  socket_io_client: ^2.0.3+1

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Charts
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  google_fonts: ^6.2.1

  # Images
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Maps (OpenStreetMap - free)
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: any

  # Scanner
  mobile_scanner: ^5.1.1

  # Date/Calendar
  intl: any
  nepali_date_converter: any
  table_calendar: any

  # Payments (Nepal)
  uuid: ^4.3.3

  # Utilities
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  logger: ^2.4.0
  image_picker: ^1.1.2

  # Data classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.0.2
  riverpod_generator: ^2.4.3

flutter:
  assets:
    - assets/lottie/
    - assets/images/
