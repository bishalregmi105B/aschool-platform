description: 'Author and publish bilingual (EN/NE) chapter content on top of the CDC/NEB
  curriculum: teaching notes, worked examples with steps, common misconceptions, formulas
  (LaTeX + spoken form), NEB/SEE exam tips and a key terms glossary. Includes the
  exercise bank typed to Nepal''s 19 question patterns — never forced multiple-choice
  — and a student chapter reader. Content is versioned, reviewable and publishable
  per school, with a school-override chain over platform-seeded curriculum. The AI
  Teacher teaches ONLY from what this plugin publishes; a school does not need AI
  to use its own chapters and question banks.'
