slug: assignments
name: "Assignment Management"
name_nepali: "गृहकार्य व्यवस्थापन"
category: starter
price_monthly: 199
price_yearly: 1999
emoji: "📋"
icon: "FileText"
description: "Create, distribute, submit, and grade assignments with file uploads and AI feedback"

api_blueprint: "app.api.v1.assignments"
models_module: "app.models.assignment"

depends_on:
  - academics
conflicts_with: []

frontend:
  route: "/dashboard/assignments"
  sidebar:
    section: "Exam & Performance"
    label: "Assignments"
    label_nepali: "गृहकार्य"
    icon: "PenTool"
    subitems:
      - { label: "All Assignments", route: "/dashboard/assignments" }
      - { label: "Create", route: "/dashboard/assignments/create" }
      - { label: "Submissions", route: "/dashboard/assignments/submissions" }
    visible_to: ["school_admin", "teacher"]

flutter:
  admin_app: null
  teacher_app:
    { feature_folder: "assignments", tabs: ["Create", "Review", "Grades"] }
  parent_app: { feature_folder: "assignments", tabs: ["Child's Homework"] }
  student_app:
    { feature_folder: "assignments", tabs: ["My Assignments", "Submit"] }

events:
  emits:
    - "assignment.created"
    - "assignment.submitted"
    - "assignment.graded"
  listens: []
