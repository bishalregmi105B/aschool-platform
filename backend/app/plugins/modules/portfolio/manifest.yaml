slug: portfolio
name: "Student Portfolio"
name_nepali: "विद्यार्थी पोर्टफोलियो"
category: growth
price_monthly: 399
price_yearly: 3999
emoji: "🎨"
icon: "Palette"
description: "Digital student portfolios, achievement tracking, micro-credentials, project showcases"

# DEPRECATED duplicate of `student_portfolio` (growth, NPR 299) — same
# feature (same name, same api_blueprint app.api.v1.portfolio, same models)
# published twice at different prices. All consumer surfaces gate
# student_portfolio (web PluginGate, mobile visibility, flutter apps), so
# student_portfolio is canonical. seed.py syncs `published: false` →
# Plugin.is_published=False so the marketplace lists only student_portfolio.
# The portfolio→student_portfolio alias in app/plugins/decorators.py is KEPT
# so schools that already installed portfolio keep passing
# student_portfolio-gated routes.
published: false
deprecated: true

api_blueprint: "app.api.v1.portfolio"
models_module: "app.models.portfolio"

depends_on: []
conflicts_with: []

frontend:
  route: "/portfolio"
  sidebar:
    section: null
    label: "Portfolio"
    label_nepali: "पोर्टफोलियो"
    icon: "Palette"
    subitems:
      - { label: "Students", route: "/portfolio" }
      - { label: "Achievements", route: "/portfolio/achievements" }
      - { label: "Credentials", route: "/portfolio/credentials" }
    visible_to: []

flutter:
  admin_app: { feature_folder: "portfolio", tabs: ["Browse", "Credentials"] }
  teacher_app: { feature_folder: "portfolio", tabs: ["Review", "Award"] }
  parent_app: { feature_folder: "portfolio", tabs: ["Child's Portfolio"] }
  student_app: { feature_folder: "portfolio", tabs: ["My Portfolio", "Build"] }

events:
  emits:
    - "portfolio.achievement_added"
    - "portfolio.credential_issued"
  listens:
    - "gamification.badge_earned"
