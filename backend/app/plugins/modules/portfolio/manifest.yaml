flutter:
  admin_app: { feature_folder: "portfolio", tabs: ["Browse", "Credentials"] }
  teacher_app: { feature_folder: "portfolio", tabs: ["Review", "Award"] }
  parent_app: { feature_folder: "portfolio", tabs: ["Child's Portfolio"] }
  student_app: { feature_folder: "portfolio", tabs: ["My Portfolio", "Build"] }

events:
