slug: gamification
name: "Student Gamification"
name_nepali: "विद्यार्थी गेमिफिकेसन"
category: growth
price_monthly: 149
price_yearly: 1490
emoji: "🏆"
icon: "Trophy"
description: "Points, badges, streaks, leaderboards, house system, rewards for attendance, grades, and behavior"

api_blueprint: "app.api.v1.gamification"
models_module: "app.models.gamification"

depends_on:
  - attendance
conflicts_with: []

frontend:
  route: "/dashboard/gamification"
  sidebar:
    section: "Student Life"
    label: "Gamification"
    label_nepali: "गेमिफिकेसन"
    icon: "Trophy"
    subitems:
      - { label: "Dashboard", route: "/dashboard/gamification" }
      - { label: "Badges", route: "/dashboard/gamification/badges" }
      - { label: "Leaderboard", route: "/dashboard/gamification/leaderboard" }
      - { label: "Houses", route: "/dashboard/gamification/houses" }
      - { label: "Rewards", route: "/dashboard/gamification/rewards" }
    visible_to: ["school_admin", "teacher"]

flutter:
  admin_app:
    { feature_folder: "gamification", tabs: ["Settings", "Badges", "Houses"] }
  teacher_app:
    { feature_folder: "gamification", tabs: ["Award Points", "Leaderboard"] }
  parent_app: { feature_folder: "achievements", tabs: ["Child's Achievements"] }
  student_app:
    {
      feature_folder: "achievements",
      tabs: ["My Points", "Badges", "Leaderboard"],
    }

events:
  emits:
    - "gamification.points_awarded"
    - "gamification.badge_earned"
  listens:
    - "attendance.marked"
    - "assignment.submitted"
    - "exams.result_published"
