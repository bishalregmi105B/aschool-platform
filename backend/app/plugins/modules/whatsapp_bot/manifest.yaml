slug: whatsapp_bot
name: "WhatsApp Bot"
name_nepali: "व्हाट्सएप बोट"
category: starter
price_monthly: 499
price_yearly: 4999
emoji: "💬"
icon: "MessageCircle"
description: "Two-way WhatsApp chatbot for parents — attendance, fees, results, bus tracking, AI chat in Nepali/English"

api_blueprint: "app.api.v1.whatsapp_bot"
models_module: "app.models.notification"
services:
  - "app.services.communications.whatsapp"
tasks:
  - "app.tasks.whatsapp_sender"

depends_on: []
conflicts_with: []

frontend:
  route: "/dashboard/communications/whatsapp"
  sidebar:
    section: "Communication & Media"
    label: "WhatsApp Bot"
    label_nepali: "व्हाट्सएप बोट"
    icon: "MessageCircle"
    subitems:
      - {
          label: "Conversations",
          route: "/dashboard/communications/whatsapp/conversations",
        }
      - {
          label: "AI Settings",
          route: "/dashboard/communications/whatsapp/ai-settings",
        }
      - {
          label: "Templates",
          route: "/dashboard/communications/whatsapp/templates",
        }
      - {
          label: "Analytics",
          route: "/dashboard/communications/whatsapp/analytics",
        }
    visible_to: ["school_admin"]

flutter:
  admin_app: { feature_folder: "whatsapp", tabs: ["Conversations", "Settings"] }
  teacher_app: null
  parent_app: null
  student_app: null

events:
  emits:
    - "whatsapp.message_received"
    - "whatsapp.message_sent"
  listens:
    - "attendance.marked"
    - "fees.collected"
    - "exams.result_published"
