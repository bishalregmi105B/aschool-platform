slug: lms
name: "Learning Management System"
name_nepali: "शिक्षण व्यवस्थापन प्रणाली"
category: growth
price_monthly: 799
price_yearly: 7999
emoji: "📹"
icon: "MonitorPlay"
description: "Live classes via Jitsi, recorded class library, course builder, AI adaptive learning paths, student watch analytics"

api_blueprint: "app.api.v1.lms"
models_module: "app.models.lms"
services:
  - "app.services.lms.video_service"
  - "app.services.lms.content_engine"
  - "app.services.ai.adaptive_learning"
tasks:

depends_on:
  - attendance
  - academics
conflicts_with: []

frontend:
  route: "/dashboard/lms"
  sidebar:
    section: "Library & Learning"
    label: "LMS"
    label_nepali: "एल.एम.एस"
    icon: "MonitorPlay"
    subitems:
      - { label: "Dashboard", route: "/dashboard/lms" }
      - { label: "Courses", route: "/dashboard/lms/courses" }
      - { label: "Live Classes", route: "/dashboard/lms/live-classes" }
      - { label: "Recordings", route: "/dashboard/lms/recordings" }
      - { label: "AI Tutor", route: "/dashboard/lms/ai-tutor" }
    visible_to: ["school_admin", "teacher"]

flutter:
  admin_app:
    {
      feature_folder: "lms",
      tabs: ["Course Management", "Live Class Schedule"],
    }
  teacher_app:
    {
      feature_folder: "lms",
      tabs: ["My Courses", "Start Live Class", "Recordings"],
    }
  parent_app:
    { feature_folder: "lms", tabs: ["Child's Courses", "Watch History"] }
  student_app:
    {
      feature_folder: "lms",
      tabs: ["My Courses", "Live Classes", "Recordings"],
    }

events:
  emits:
    - "lms.class_started"
    - "lms.class_ended"
    - "lms.course_completed"
  listens:
    - "attendance.marked"
    - "exams.result_published"
