slug: wellbeing
name: "Student Wellbeing"
name_nepali: "विद्यार्थी कल्याण"
category: growth
price_monthly: 499
price_yearly: 4999
emoji: "😊"
icon: "Smile"
description: "Daily mood check-ins, wellbeing surveys, counselor sessions, mental health tracking, early intervention alerts"

api_blueprint: "app.api.v1.wellbeing"
models_module: "app.models.wellbeing"
services:
  - "app.services.ai.sentiment_analysis"

depends_on: []
conflicts_with: []

frontend:
  route: "/dashboard/wellbeing"
  sidebar:
    section: "Student Wellbeing"
    label: "Wellbeing"
    label_nepali: "कल्याण"
    icon: "Smile"
    subitems:
      - { label: "Dashboard", route: "/dashboard/wellbeing" }
      - { label: "Mood Trends", route: "/dashboard/wellbeing/moods" }
      - { label: "Counselor", route: "/dashboard/wellbeing/counselor" }
      - { label: "Surveys", route: "/dashboard/wellbeing/surveys" }
    visible_to: ["school_admin", "teacher"]

flutter:
  admin_app: { feature_folder: "wellbeing", tabs: ["Dashboard", "Alerts"] }
  teacher_app:
    { feature_folder: "wellbeing", tabs: ["Class Mood", "Referrals"] }
  parent_app: { feature_folder: "wellbeing", tabs: ["Child Wellbeing"] }
  student_app:
    { feature_folder: "wellbeing", tabs: ["Mood Check-in", "Counselor Chat"] }

events:
  emits:
    - "wellbeing.mood_logged"
    - "wellbeing.alert_triggered"
  listens: []
