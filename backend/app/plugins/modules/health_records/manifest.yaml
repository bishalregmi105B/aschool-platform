slug: health_records
name: "Student Health Records"
name_nepali: "विद्यार्थी स्वास्थ्य अभिलेख"
category: growth
price_monthly: 299
price_yearly: 2999
emoji: "🏥"
icon: "Heart"
description: "Medical records, vaccination tracking, allergy alerts, health checkup logs, BMI tracking"

api_blueprint: "app.api.v1.health_records"
models_module: "app.models.health"

depends_on: []
conflicts_with: []

frontend:
  route: "/dashboard/health-records"
  sidebar:
    section: "Student Wellbeing"
    label: "Health Records"
    label_nepali: "स्वास्थ्य अभिलेख"
    icon: "HeartPulse"
    subitems:
      - { label: "Records", route: "/dashboard/health-records/records" }
      - {
          label: "Vaccinations",
          route: "/dashboard/health-records/vaccinations",
        }
      - { label: "Allergies", route: "/dashboard/health-records/allergies" }
    visible_to: ["school_admin"]

flutter:
  admin_app: { feature_folder: "health", tabs: ["Records", "Vaccinations"] }
  teacher_app: null
  parent_app: { feature_folder: "health", tabs: ["Child Health Records"] }
  student_app: null

events:
  emits:
    - "health.record_updated"
  listens: []
