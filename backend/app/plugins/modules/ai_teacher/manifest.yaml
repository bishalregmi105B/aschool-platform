slug: ai_teacher
name: AI Teacher (Live Whiteboard Tutor)
name_nepali: एआई शिक्षक (लाइभ ह्वाइटबोर्ड ट्युटर)
category: premium
price_monthly: 1499
price_yearly: 14990
emoji: 👩‍🏫
icon: PenTool
version: 1.0.0
author: ASchool
published: true
coming_soon: false
description: A live AI teacher that speaks and hand-writes on an animated whiteboard,
  chapter by chapter, grounded strictly in your school's published curriculum content
  (admin-entered — no OCR, no guessing). Students interrupt by voice or text and the
  teacher answers on the board, then resumes exactly where it left off. Mastery is
  recorded per curriculum learning outcome and flows into progress reports. Runs on
  a dedicated, isolated service; ASchool owns every lesson record, cost and safety
  flag.
depends_on:
- ai_suite
- nepal_curriculum
conflicts_with: []
models:
- app.models.ai_teacher
- app.models.teaching_content
events:
  emits:
  listens:
  - curriculum.content_published
  - student.consent_revoked
  - plugin.deactivated
owns_tables:
- ai_teacher_service_keys
- ai_teacher_lessons
- ai_teacher_lesson_chapters
- ai_teacher_messages
- ai_teacher_mastery
- ai_teacher_learning_events
capabilities:
  api_blueprint: app.plugins.modules.ai_teacher.routes
  models_module: app.models.ai_teacher
  services:
  - app.plugins.modules.ai_teacher.service_client
  tasks:
  - app.plugins.modules.ai_teacher.tasks
ui:
