      - { label: "New Report", route: "/dashboard/incidents/create" }
      - { label: "Actions", route: "/dashboard/incidents/actions" }
    visible_to: ["school_admin", "teacher"]

flutter:
  admin_app:
    { feature_folder: "incidents", tabs: ["Reports", "Actions", "Statistics"] }
  teacher_app: { feature_folder: "incidents", tabs: ["Report Incident"] }
  parent_app: null
  student_app: null

events:
  emits:
    - "incident.reported"
