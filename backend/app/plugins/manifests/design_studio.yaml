slug: design_studio
name: "Docs & Designer"
name_nepali: "डक्स र डिजाइनर"
category: growth
price_monthly: 499
price_yearly: 4999
emoji: "🎨"
icon: "Palette"
description: "Design school documents, certificates, ID cards, notices and more — with AI assistance."

# api_blueprint is registered explicitly in app/api/v1/__init__.py (under /api/v1/)
# api_blueprint: "app.api.v1.design_studio"
models_module: "app.models.designer_document"
services:
  - "app.services.designer.template_engine"
  - "app.services.designer.pdf_generator"
  - "app.services.designer.document_store"
  - "app.services.ai.token_hub"

depends_on: []
conflicts_with: []

frontend:
  route: "/designer"
  sidebar:
    label: "Docs & Designer"
    label_nepali: "डिजाइन स्टुडियो"
    icon: "Palette"
    subitems:
      - { label: "Templates",   route: "/designer/templates" }
      - { label: "My Documents", route: "/designer" }
      - { label: "ID Cards",    route: "/designer/templates?category=id_cards" }
      - { label: "Certificates", route: "/designer/templates?category=certificates" }
      - { label: "Bulk Generate", route: "/designer/bulk" }
    visible_to: ["school_admin", "teacher"]

flutter:
  admin_app: { feature_folder: "design_studio", tabs: ["Templates", "Designs", "ID Cards"] }
