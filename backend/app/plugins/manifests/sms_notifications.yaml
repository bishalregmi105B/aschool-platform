slug: sms_notifications
name: "SMS Notifications"
name_nepali: "एसएमएस सूचना"
category: starter
price_monthly: 199
price_yearly: 1999
emoji: "📱"
icon: "MessageSquare"
description: "Bulk SMS via Sparrow SMS, attendance alerts, fee reminders, exam notifications, custom templates"

api_blueprint: "app.api.v1.sms"
models_module: "app.models.notification"
services:
  - "app.services.communications.sparrow_sms"
tasks:
  - "app.tasks.sms_sender"

depends_on: []
conflicts_with: []

frontend:
  route: "/sms"
  sidebar:
    label: "SMS"
    label_nepali: "एसएमएस"
    icon: "MessageSquare"
    subitems:
      - { label: "Send SMS", route: "/sms/send" }
      - { label: "Templates", route: "/sms/templates" }
      - { label: "History", route: "/sms/history" }
      - { label: "Credits", route: "/sms/credits" }
    visible_to: ["school_admin"]

flutter:
  admin_app: { feature_folder: "sms", tabs: ["Send", "Templates", "History"] }
  teacher_app: null
  parent_app: null
  student_app: null

events:
  emits:
    - "sms.sent"
  listens:
    - "attendance.absent_alert"
    - "fees.overdue"
