slug: ai_insights
name: "AI School Intelligence"
name_nepali: "एआई विद्यालय विश्लेषण"
category: growth
price_monthly: 999
price_yearly: 9999
emoji: "🧠"
icon: "Brain"
description: "Weekly AI intelligence reports, at-risk student detection, fee defaulter prediction, principal morning brief"

api_blueprint: "app.api.v1.design_studio"
models_module: "app.models.ai_insight"
services:
  - "app.services.ai.school_insights"
  - "app.services.ai.risk_detection"
tasks:
  - "app.tasks.weekly_insights"
  - "app.tasks.daily_brief"

depends_on:
  - attendance
conflicts_with: []

frontend:
  route: "/ai-insights"
  sidebar:
    label: "AI Insights"
    label_nepali: "एआई विश्लेषण"
    icon: "Brain"
    subitems:
      - { label: "Dashboard", route: "/ai-insights" }
      - { label: "Weekly Report", route: "/ai-insights/weekly" }
      - { label: "Risk Students", route: "/ai-insights/risk" }
      - { label: "Predictions", route: "/ai-insights/predictions" }
    visible_to: ["school_admin"]

flutter:
  admin_app: { feature_folder: "ai_insights", tabs: ["Dashboard", "Risk Alerts", "Weekly"] }
  teacher_app: null
  parent_app: null
  student_app: null

events:
  emits:
    - "ai.risk_alert"
    - "ai.weekly_report"
  listens:
    - "attendance.marked"
    - "exams.result_published"
    - "fees.collected"
