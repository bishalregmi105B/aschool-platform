slug: conferences
name: "Parent-Teacher Conferences"
name_nepali: "अभिभावक-शिक्षक भेटघाट"
category: growth
price_monthly: 299
price_yearly: 2999
emoji: "🤝"
icon: "Users"
description: "Online booking for PT conferences, time slot management, video calls, notes, follow-up tracking"

api_blueprint: "app.api.v1.conferences"
models_module: "app.models.conference"

depends_on: []
conflicts_with: []

frontend:
  route: "/conferences"
  sidebar:
    label: "Conferences"
    label_nepali: "भेटघाट"
    icon: "Users"
    subitems:
      - { label: "Schedule", route: "/conferences" }
      - { label: "Time Slots", route: "/conferences/slots" }
      - { label: "History", route: "/conferences/history" }
    visible_to: ["school_admin", "teacher"]

flutter:
  admin_app: { feature_folder: "conferences", tabs: ["Schedule", "Reports"] }
  teacher_app: { feature_folder: "conferences", tabs: ["My Slots", "Upcoming"] }
  parent_app: { feature_folder: "conferences", tabs: ["Book Slot", "History"] }
  student_app: null

events:
  emits:
    - "conference.booked"
    - "conference.completed"
  listens: []
