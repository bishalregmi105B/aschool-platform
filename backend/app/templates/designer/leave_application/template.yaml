template_key: leave_application
name: Student Leave Application
name_nepali: बिदा आवेदन (विद्यार्थी)
category: letters
editor_type: writer
description: "Student leave application — guardian request with approval footer."
page_size: A4
thumbnail_emoji: "✉"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
