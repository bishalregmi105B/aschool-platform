template_key: report_card_writer
name: Report Card (Document)
category: reports
editor_type: writer
description: Editable report card document with subject rows and grading legend
page_size: A4
thumbnail_emoji: 📝
is_default: true
size:
  width: 794
  height: 1123
fields:
- name
- class
- section
- roll_no
- exam_name
