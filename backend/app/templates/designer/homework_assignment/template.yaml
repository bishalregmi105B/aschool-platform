template_key: homework_assignment
name: Homework Assignment Sheet
name_nepali: साप्ताहिक गृहकार्य
category: lesson_plans
editor_type: writer
description: "Weekly homework grid with daily parent-signature column and Nepali note."
page_size: A4
thumbnail_emoji: "📚"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
