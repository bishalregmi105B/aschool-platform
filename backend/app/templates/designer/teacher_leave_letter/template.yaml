template_key: teacher_leave_letter
name: Teacher Leave Request
name_nepali: बिदा आवेदन (शिक्षक)
category: letters
editor_type: writer
description: "Teacher / staff leave request letter with approval footer."
page_size: A4
thumbnail_emoji: "✉"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
