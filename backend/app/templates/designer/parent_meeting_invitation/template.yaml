template_key: parent_meeting_invitation
name: Parents' Day Invitation
name_nepali: अभिभावक भेटघाट सूचना
category: notices
editor_type: writer
description: "Bilingual Parents' Day invitation with slot booking and session details table."
page_size: A4
thumbnail_emoji: "🤝"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
