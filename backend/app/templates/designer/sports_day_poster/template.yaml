template_key: sports_day_poster
name: Sports Day Poster
name_nepali: खेलकुद दिवस पोस्टर
category: posters
editor_type: designer
description: "A4 sports-day poster — events list, date/venue strip, welcome banner."
page_size: A4
thumbnail_emoji: "🏅"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone
  - school_website

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
