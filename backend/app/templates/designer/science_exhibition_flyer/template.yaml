template_key: science_exhibition_flyer
name: Science Exhibition Flyer
name_nepali: विज्ञान प्रदर्शनी
category: posters
editor_type: designer
description: "A4 bilingual science-exhibition flyer — student/visitor info cards and two photo slots."
page_size: A4
thumbnail_emoji: "🔬"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone
  - school_website
  - event_photo

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
