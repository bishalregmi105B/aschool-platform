template_key: recommendation_letter
name: Recommendation Letter
name_nepali: सिफारिस पत्र
category: letters
editor_type: writer
description: "To-whom-it-may-concern student recommendation with GPA/conduct strip and validity footer."
page_size: A4
thumbnail_emoji: "🎓"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
