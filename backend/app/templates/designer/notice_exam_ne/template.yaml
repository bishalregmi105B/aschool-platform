template_key: notice_exam_ne
name: Exam Notice (Nepali)
name_nepali: परीक्षा सूचना
category: notices
editor_type: writer
description: "Nepali-language exam notice — routine table, rules and controller/principal signatures."
page_size: A4
thumbnail_emoji: "📢"
is_default: true
size: {width: 794, height: 1123}
fields:
  - school_name
  - school_address
  - school_phone

autofill:
  sources: [school]
  notes: >
    School fields ({school_name}, {school_address}, {school_phone}, {school_website},
    {school_logo}) merge into every render automatically. Record data (students,
    exams) is provided by bulk generation or the data-fill panel.
