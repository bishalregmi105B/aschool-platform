name: aschool_teacher
description: ASchool Teacher App — Daily classroom management
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  aschool_shared:
    path: ../aschool_shared
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^13.2.0
  fl_chart: any
  speech_to_text: ^7.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

dependency_overrides:
  # share_plus 9 (from aschool_shared) is incompatible with web >=1.1 —
  # pin the same 0.5.x line the other apps resolve to, or web builds fail.
  web: 0.5.1
