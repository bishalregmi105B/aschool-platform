services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/app-web:/var/www/app.brighternepal.com:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - flask
      - nextjs
    restart: always
    networks:
      - default
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  nextjs:
    # Prefer the registry image built by CI; the build: block is a local
    # fallback only. `docker compose pull nextjs` + `up -d` deploys the
    # latest main build instead of recompiling whatever source sits on the
    # server (a stale checkout was silently shipping the old UI).
    image: ghcr.io/bishalregmi105b/aschool-platform/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_URL=${API_URL:-http://flask:5000}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
        - NEXT_PUBLIC_BASE_DOMAIN=${NEXT_PUBLIC_BASE_DOMAIN}
    environment:
      - NODE_ENV=production
      - API_URL=${API_URL:-http://flask:5000}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - NEXT_PUBLIC_BASE_DOMAIN=${NEXT_PUBLIC_BASE_DOMAIN}
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  flask:
    image: ghcr.io/bishalregmi105b/aschool-platform/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: gunicorn --worker-class eventlet -w 4 -b 0.0.0.0:5000 --timeout 120 --keep-alive 5 wsgi:app
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - AI_DEFAULT_DAILY_LIMIT=${AI_DEFAULT_DAILY_LIMIT:-10000}
      - AI_DEFAULT_MONTHLY_LIMIT=${AI_DEFAULT_MONTHLY_LIMIT:-100000}
      - AI_QUOTA_ENFORCEMENT=${AI_QUOTA_ENFORCEMENT:-true}
      - SPARROW_SMS_TOKEN=${SPARROW_SMS_TOKEN}
      - ESEWA_MERCHANT_ID=${ESEWA_MERCHANT_ID}
      - ESEWA_SECRET_KEY=${ESEWA_SECRET_KEY}
      - KHALTI_SECRET_KEY=${KHALTI_SECRET_KEY}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
      - SENTRY_DSN=${SENTRY_DSN}
      - CLOUDFLARE_R2_ACCESS_KEY=${CLOUDFLARE_R2_ACCESS_KEY}
      - CLOUDFLARE_R2_SECRET_KEY=${CLOUDFLARE_R2_SECRET_KEY}
      - CLOUDFLARE_R2_BUCKET=${CLOUDFLARE_R2_BUCKET}
      - FILE_STORAGE_BACKEND=${FILE_STORAGE_BACKEND:-r2}
      - LOCAL_UPLOAD_DIR=/app/uploads
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-aschool}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    env_file:
      - .env
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-aschool}
      - POSTGRES_USER=${POSTGRES_USER:-aschool}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aschool}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -Q default,ai,notifications,gps -l info --concurrency=4
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SPARROW_SMS_TOKEN=${SPARROW_SMS_TOKEN}
      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS}
      - SENTRY_DSN=${SENTRY_DSN}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat -l info
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - BASE_DOMAIN=${BASE_DOMAIN}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      - SENTRY_DSN=${SENTRY_DSN}
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  flower:
    image: mher/flower:2.0
    command: celery --broker=${REDIS_URL} flower --port=5555 --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=${REDIS_URL}
    depends_on:
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local
  uploads_data:
    driver: local

networks:
  default:
    name: aschool_default
